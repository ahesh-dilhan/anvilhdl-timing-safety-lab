name: Pinned Anvil integration

on:
  push:
    paths:
      - "anvil/**"
      - "scripts/anvil_conformance.py"
      - "tests/test_conformance_harness.py"
      - "UPSTREAM.lock"
      - ".github/workflows/anvil-integration.yml"
  pull_request:
    paths:
      - "anvil/**"
      - "scripts/anvil_conformance.py"
      - "tests/test_conformance_harness.py"
      - "UPSTREAM.lock"
      - ".github/workflows/anvil-integration.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out timing-safety lab
        uses: actions/checkout@v4
        with:
          path: lab
      - name: Check out pinned AnvilHDL
        uses: actions/checkout@v4
        with:
          repository: kisp-nus/anvil
          ref: d138cabedbfc3b65c08249ce6a55cb90dad959da
          path: upstream
      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2.0"
          dune-cache: true
      - name: Install compiler dependencies
        working-directory: upstream
        run: opam install . --deps-only --with-test
      - name: Build compiler
        working-directory: upstream
        run: opam exec -- dune build
      - name: Check source fixtures through JSON API
        working-directory: lab
        env:
          ANVIL_COMMAND: opam exec -- dune exec --root ../upstream anvil --
        run: python3 scripts/anvil_conformance.py
