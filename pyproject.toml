[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anvilhdl-timing-safety-lab"
version = "0.1.0"
description = "A bounded executable companion to the AnvilHDL timing-safety paper"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Ahesh Dilhan" }
]
keywords = [
  "hardware-description-language",
  "timing-safety",
  "type-systems",
  "formal-methods",
  "systemverilog"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)"
]
dependencies = []

[project.urls]
Repository = "https://github.com/ahesh-dilhan/anvilhdl-timing-safety-lab"
Paper = "https://arxiv.org/abs/2503.19447"
"Official AnvilHDL" = "https://github.com/kisp-nus/anvil"

[project.scripts]
anvil-lab = "anvil_lab.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
